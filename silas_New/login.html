<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk — SILAS</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ac:#d9963a;--ac-d:#b97a22;--ac-s:#fbf0dd;--navy:#0f1b33;--cream:#f6f4ef;--line:#e8e4da;--ink:#16203a;--mute:#6b7388;--red:#c8453f;--sans:'Inter',system-ui,sans-serif;--serif:'Fraunces',Georgia,serif}
body[data-role=petugas]{--ac:#2e8070;--ac-d:#216355;--ac-s:#dff0ec}
body[data-role=siswa]{--ac:#1e5eff;--ac-d:#0f3fb8;--ac-s:#eaf1ff}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--cream);min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.side{background:var(--navy);color:#cfd6e6;padding:48px;display:flex;flex-direction:column;justify-content:space-between;transition:background .3s}
body[data-role=siswa] .side{background:#0b2a6b}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#e0a64a,#5a9a6a)}
body[data-role=siswa] .logo{background:linear-gradient(135deg,#1e5eff,#59a1ff)}
.brand b{font-family:var(--serif);color:#fff;font-size:22px}
.side h2{font-family:var(--serif);color:#fff;font-size:34px;line-height:1.2;max-width:380px}
.side p{margin-top:14px;font-size:15px;color:#9fabc6;max-width:360px;line-height:1.6}
.side small{color:#7f8aa5;font-size:12px}
.main{display:grid;place-items:center;padding:32px}
.box{width:100%;max-width:400px}
h1{font-family:var(--serif);font-size:28px}
.sub{color:var(--mute);font-size:14px;margin:6px 0 24px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:22px}
.tabs button{border:0;background:none;font:500 14px var(--sans);padding:10px;border-radius:9px;color:var(--mute);cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff}
label{display:block;font-size:13px;font-weight:500;margin:0 0 6px}
.f{margin-bottom:16px;position:relative}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:14px;outline:none}
input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-s)}
.eye{position:absolute;right:10px;bottom:9px;border:0;background:none;color:var(--mute);cursor:pointer;font-size:13px;padding:4px 6px}
.err{display:none;background:#fdecec;color:var(--red);border:1px solid #f5c6c6;border-radius:10px;padding:10px 13px;font-size:13px;margin-bottom:16px}
.go{width:100%;padding:13px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:600 15px var(--sans);cursor:pointer}
.go:hover{background:var(--ac-d)}.go:disabled{opacity:.6;cursor:wait}
@media(max-width:820px){body{grid-template-columns:1fr}.side{display:none}}
</style>
</head>
<body data-role="admin">
<section class="side">
  <div class="brand"><div class="logo"></div><b>SILAS</b></div>
  <div><h2>Sistem Informasi Peminjaman Laptop Sekolah</h2><p>Kelola inventaris, proses peminjaman, dan pantau pengembalian laptop dalam satu tempat.</p></div>
  <small>© 2026 SILAS</small>
</section>

<section class="main">
  <div class="box">
    <h1>Selamat datang</h1>
    <div class="sub" id="sub">Masuk sebagai Admin untuk mengelola seluruh data.</div>

    <div class="tabs" id="tabs">
      <button type="button" data-r="admin" class="on">Admin</button>
      <button type="button" data-r="petugas">Petugas</button>
      <button type="button" data-r="siswa">Siswa</button>
    </div>

    <div class="err" id="err"></div>
    <form id="frm" autocomplete="on">
      <div class="f"><label for="u">Username</label><input id="u" name="username" autocomplete="username" required autofocus></div>
      <div class="f"><label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required>
        <button type="button" class="eye" id="eye">Tampilkan</button></div>
      <button class="go" id="go">Masuk</button>
    </form>
  </div>
</section>

<script>
const $ = id => document.getElementById(id);
const TEKS = {admin:'Masuk sebagai Admin untuk mengelola seluruh data.', petugas:'Masuk sebagai Petugas untuk memproses peminjaman.', siswa:'Masuk sebagai Siswa untuk meminjam laptop sekolah.'};
let role = 'admin';

$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  role = b.dataset.r; document.body.dataset.role = role;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('sub').textContent = TEKS[role]; $('err').style.display = 'none';
});
$('eye').onclick = () => {
  const t = $('p').type === 'password';
  $('p').type = t ? 'text' : 'password'; $('eye').textContent = t ? 'Sembunyikan' : 'Tampilkan';
};

$('frm').addEventListener('submit', async e => {
  e.preventDefault();
  $('go').disabled = true; $('go').textContent = 'Memproses…'; $('err').style.display = 'none';
  try {
    const r = await fetch('api/login.php', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({role, username: $('u').value, password: $('p').value})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Login gagal');
    location.href = d.redirect;
  } catch (x) {
    $('err').textContent = x.message === 'Failed to fetch' ? 'Server tidak terjangkau. Pastikan Apache & MySQL XAMPP aktif.' : x.message;
    $('err').style.display = 'block';
    $('go').disabled = false; $('go').textContent = 'Masuk';
  }
});
</script>
</body>
</html>
