<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajukan Pinjam — SILAS</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="siswa.css">
</head>
<body>
<aside>
  <div class="brand"><div class="logo"></div><div><b>SILAS</b><small>PORTAL SISWA</small></div></div>
  <div class="note">Masuk sebagai Siswa — pinjam laptop sekolah</div>
  <nav>
    <div class="grp">Ringkasan</div>
    <a href="dashboard.html">▦ Dashboard</a>
    <div class="grp">Peminjaman</div>
    <a class="on" href="ajukanPinjam.html">＋ Ajukan Pinjam</a>
    <a href="peminjamanSaya.html">▤ Peminjaman Saya <span class="b" id="bSaya">0</span></a>
    <a href="riwayatSiswa.html">↺ Riwayat</a>
    <div class="grp">Akun</div>
    <a href="profilSiswa.html">☺ Profil</a>
  </nav>
  <div class="me"><div class="av" id="av2">SW</div><div><b class="nm">Siswa</b><small>Siswa</small></div></div>
  <a class="out" href="../api/logout.php">⇤ Keluar</a>
</aside>
<main>
  <div class="top">
    <input type="search" id="cari" placeholder="Cari merk, tipe, atau kode laptop…">
    <div class="chip"><div class="av" id="av1">SW</div><div><b class="nm">Siswa</b><small>Siswa</small></div></div>
  </div>
  <div class="wrap">
    <h1>Ajukan Pinjam</h1><div class="sub" id="aturan">Pilih laptop yang tersedia, lalu tentukan tanggal pinjam.</div>
    <div class="alert" id="blok"></div>
    <div class="lapgrid" id="grid"><div class="empty">Memuat data…</div></div>
  </div>
</main>
<dialog id="dlg"><form id="frm" method="dialog">
  <h3>Ajukan peminjaman</h3><p id="info" class="sub" style="margin:0 0 14px"></p>
  <div class="err" id="err"></div><input type="hidden" id="idl">
  <div class="g2"><label>Tanggal pinjam<input type="date" id="a" required></label><label>Harus kembali<input type="date" id="b" required></label></div>
  <p class="sub" id="catatan" style="margin:0 0 8px;font-size:13px"></p>
  <div class="act"><button type="button" class="btn" onclick="dlg.close()">Batal</button><button class="btn pri" id="kirim">Kirim pengajuan</button></div>
</form></dialog>
<div class="toast" id="toast"></div>
<script>
const API = '../api/ajukanSiswa.php', KC = {'Baik':'ok','Perlu servis ringan':'warn','Rusak':'bad'};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tgl = s => s ? new Date(s).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}) : '—';
const lokal = d => new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const geser = (s, n) => { const d = new Date(s); d.setDate(d.getDate()+n); return lokal(d); };
let _t; const toast = m => { const e=$('toast'); e.textContent=m; e.classList.add('on'); clearTimeout(_t); _t=setTimeout(()=>e.classList.remove('on'),2800); };
async function api(method, url, body){
  const r = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
  if (r.status === 401) { location.href = '../login.html'; throw new Error('Sesi berakhir'); }
  const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Gagal'); return j;
}
function akun(nama, aktif){
  document.querySelectorAll('.nm').forEach(e => e.textContent = nama);
  $('av1').textContent = $('av2').textContent = nama.split(' ').map(s=>s[0]).join('').slice(0,2).toUpperCase();
  if (aktif !== undefined && $('bSaya')) $('bSaya').textContent = aktif;
}

let rows = [], maks = 7, blokir = null, d, pra = new URLSearchParams(location.search).get('id');
async function load(){
  try {
    const j = await api('GET', `${API}?q=${encodeURIComponent($('cari').value)}`);
    rows = j.data; maks = j.maksHari; blokir = j.blokir; akun(j.nama, j.aktif);
    $('aturan').textContent = `Pilih laptop yang tersedia. Maksimal ${j.maksAktif} peminjaman aktif dan lama pinjam ${j.maksHari} hari.`;
    $('blok').style.display = blokir ? 'block' : 'none'; $('blok').textContent = blokir ? '⚠ ' + blokir : '';
    $('grid').innerHTML = rows.length ? rows.map(l => `<div class="lc"><div class="ic">💻</div><b>${esc(l.merk)} ${esc(l.tipe)}</b>
      <small>${esc(l.kode_laptop)}</small><span class="bdg ${KC[l.kondisi] || 'na'}" style="width:fit-content">${esc(l.kondisi) || 'Belum diperiksa'}</span>
      <button class="btn pri" ${blokir ? 'disabled' : ''} onclick="ajukan(${l.id_laptop})">Ajukan</button></div>`).join('')
      : '<div class="empty" style="grid-column:1/-1">Tidak ada laptop tersedia saat ini.</div>';
    if (pra) { const p = pra; pra = null; if (!blokir && rows.some(r => r.id_laptop == p)) ajukan(p); }
  } catch (e) { if (e.message !== 'Sesi berakhir') $('grid').innerHTML = `<div class="empty" style="grid-column:1/-1">${esc(e.message)}</div>`; }
}
window.ajukan = id => {
  const l = rows.find(r => r.id_laptop == id), h = lokal(new Date());
  $('idl').value = id; $('info').textContent = `${l.kode_laptop} — ${l.merk} ${l.tipe}`; $('err').style.display = 'none';
  $('a').min = h; $('a').value = h; $('b').value = geser(h, maks); $('b').min = h; $('b').max = geser(h, maks);
  $('catatan').textContent = `Lama pinjam maksimal ${maks} hari. Pengajuan akan diproses oleh petugas.`;
  $('dlg').showModal();
};
$('a').addEventListener('change', () => { const a = $('a').value; if (!a) return; $('b').min = a; $('b').max = geser(a, maks); if ($('b').value > geser(a, maks) || $('b').value < a) $('b').value = geser(a, maks); });
$('frm').addEventListener('submit', async e => {
  e.preventDefault(); $('kirim').disabled = true;
  try { await api('POST', API, {id_laptop:+$('idl').value, tanggal_pinjam:$('a').value, akan_kembali:$('b').value});
        $('dlg').close(); toast('Pengajuan terkirim, menunggu persetujuan petugas'); setTimeout(() => location.href = 'peminjamanSaya.html', 1200); }
  catch (x) { $('err').textContent = x.message; $('err').style.display = 'block'; }
  $('kirim').disabled = false;
});
$('cari').addEventListener('input', () => { clearTimeout(d); d = setTimeout(load, 250); });
load();
</script>
</body>
</html>
